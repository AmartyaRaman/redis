services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports: 
      - "6379:6379"
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis:/data

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
     - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: MONGO
    volumes:
      - mongodb:/data

volumes:
  redis:
  mongodb:
    
